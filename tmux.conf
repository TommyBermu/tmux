set -g prefix C-s
set -g mouse on
bind r source-file ~/.config/tmux/tmux.conf

#para cuando se dividan los paneles
unbind C-b
unbind '"'
unbind %
unbind v
unbind r

bind e split-window -h
bind r split-window -v

#act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

set -g @tpm_plugins_path '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Guarda y restaura sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'    # Guarda sesiones automáticamente
set -g @plugin 'tmux-plugins/tmux-yank'         # Copiar texto al portapapeles del sistema

set -g @plugin 'catppuccin/tmux'

set-option -g status-position top 
set-option -g allow-rename off

# ---- Estilo de ventanas (custom): numero rodeado de color + nombre, redondeado y transparente ----
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "left"

# Colores de los bloques (ventanas NO activas)
set -g @catppuccin_window_number_color "#{@thm_lavender}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_lavender},bg=default]#[fg=#{@thm_crust},bg=#{@thm_lavender}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_lavender},bg=#{@thm_surface_0}]█"
set -g @catppuccin_window_right_separator  "#[fg=#{@thm_surface_0},bg=default]"

# Colores de los bloques (ventana ACTUAL) -> acento mauve, mas vivo
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve},bg=#{@thm_surface_1}]█"
set -g @catppuccin_window_current_right_separator  "#[fg=#{@thm_surface_1},bg=default]"


set -g @catppuccin_status_background "none"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %d-%m %H:%M"
set -ag status-right "#{E:@catppuccin_status_session}"

run '~/.config/tmux/plugins/tpm/tpm'
